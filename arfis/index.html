<!doctype html>
<html lang="lt">
<head>

<title>Arfis – autoservisas ir autodalys Elektrėnuose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--main:#157397;--main2:#0f5a77;--deep:#12303d;--bg2:#f1f6f8;--ink:#10202a;--muted:#566a75;--card:#fff;--line:rgba(20,30,40,.12);--serif:"Playfair Display",Georgia,serif;--sans:Manrope,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:#fff;color:var(--ink);line-height:1.6;padding-bottom:calc(84px + env(safe-area-inset-bottom));overflow-x:hidden}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--main2);font-weight:800}
.demo{height:32px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--deep);color:rgba(255,255,255,.8);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;padding:0 12px}
.demo a{text-decoration:underline;color:#fff}.dl{display:inline}.ds{display:none}@media(max-width:600px){.dl{display:none}.ds{display:inline}}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
.logo{display:flex;flex-direction:column;line-height:1.05}
.logo b{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--deep)}
.logo small{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:700}
nav{display:flex;gap:26px;font-size:14px;font-weight:600;color:var(--muted)}
.hcta{background:var(--main);color:#fff;border:0;border-radius:99px;padding:11px 20px;font:800 13px var(--sans);cursor:pointer}
.status{font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;color:var(--muted);white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#d0574a}
.status.open::before{background:#3f9a55;box-shadow:0 0 0 4px rgba(63,154,85,.18)}
@media(max-width:900px){nav,.hcta{display:none}}@media(min-width:901px){.status{display:none}}
.hero{padding:28px 0 44px;background:linear-gradient(180deg,var(--bg2),#fff)}
.hgrid{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
@media(max-width:900px){.hgrid{grid-template-columns:1fr;gap:24px}}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,6vw,66px);line-height:1.07;margin:12px 0 16px}
.hero h1 em{color:var(--main)}
.hero p{color:var(--muted);max-width:500px;font-size:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border-radius:99px;font:800 15px var(--sans);border:0;cursor:pointer;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.98)}.btn-main{background:var(--main);color:#fff}.btn-main:hover{filter:brightness(1.08)}
.btn-line{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.35;cursor:not-allowed}
.hphoto{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/4.2;background:var(--bg2)}
.hphoto img{width:100%;height:100%;object-fit:cover;animation:kb 20s ease-out forwards;transform:scale(1.08)}
@keyframes kb{to{transform:scale(1)}}
.badge{position:absolute;left:16px;bottom:16px;right:16px;max-width:320px;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 12px 30px rgba(0,0,0,.14);display:flex;gap:12px;align-items:center}
.badge i{width:42px;height:42px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;flex:0 0 42px}
.badge b{display:block;font-size:14px}.badge small{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted)}.chip b{color:var(--ink)}
section{padding:84px 0}@media(max-width:700px){section{padding:62px 0}}
.h2{font-family:var(--serif);font-weight:500;font-size:clamp(30px,5.4vw,52px);line-height:1.08;margin:10px 0 14px}.h2 em{color:var(--main)}
.lead{color:var(--muted);max-width:580px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}
@media(min-width:901px){.cats.c4{grid-template-columns:repeat(4,1fr)}.cats.c4 .cat img{height:160px}}
@media(max-width:900px){.cats{grid-template-columns:1fr 1fr}}@media(max-width:560px){.cats{grid-template-columns:1fr}}
.cat{border-radius:22px;overflow:hidden;background:var(--bg2);cursor:pointer;transition:transform .2s;border:1px solid var(--line)}
.cat:hover{transform:translateY(-3px)}.cat img{width:100%;height:180px;object-fit:cover}
.cat .ic{height:110px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,var(--bg2),#fff)}
.cat div.t{padding:16px 18px 18px}.cat h3{font-family:var(--serif);font-weight:500;font-size:23px}.cat p{color:var(--muted);font-size:14px}
.cat .from{margin-top:10px;display:flex;justify-content:space-between;font-weight:800;font-size:14px}.cat .from span:last-child{color:var(--main2)}
.prices{background:var(--bg2)}
.tabs{display:flex;gap:8px;margin:26px 0 16px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;padding:10px 16px;font:700 13px var(--sans);cursor:pointer}
.tab.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.plist{background:#fff;border-radius:22px;border:1px solid var(--line);padding:4px 22px}
.pi{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.pi:last-child{border:0}.pi small{display:block;color:var(--muted);font-size:12px}.pi b{white-space:nowrap}.pi .r{display:flex;align-items:center}
.pi button{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font:800 12px var(--sans);color:var(--main2);cursor:pointer;margin-left:10px;white-space:nowrap}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.about{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}@media(max-width:860px){.about{grid-template-columns:1fr;gap:24px}}
.about .ph{border-radius:22px;overflow:hidden;aspect-ratio:4/3.4;background:var(--bg2)}.about .ph img{width:100%;height:100%;object-fit:cover}
.feat{list-style:none;margin-top:16px}.feat li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.feat li i{font-style:normal;width:32px;height:32px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex:0 0 32px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.stat{background:var(--bg2);border-radius:14px;padding:14px}.stat b{display:block;font-family:var(--serif);font-size:28px;font-weight:500;color:var(--deep);line-height:1}.stat span{font-size:12px;color:var(--muted)}
.visit{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:860px){.visit{grid-template-columns:1fr}}
.box{background:var(--bg2);border-radius:22px;padding:28px}.box .big{font-family:var(--serif);font-size:28px;display:block;margin:6px 0 2px;line-height:1.2}
.hours div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}.hours div.today{color:var(--ink);font-weight:800}
footer{padding:30px 0;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar .btn{flex:1;min-height:50px}.bar .call{flex:0 0 50px;padding:0}@media(min-width:901px){.bar{display:none}body{padding-bottom:0}}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.hphoto img{animation:none}}
.ov{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:24px 24px 0 0;max-height:94svh;overflow:auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:720px){.sheet{left:50%;width:560px;margin-left:-280px;bottom:3vh;border-radius:22px;max-height:90vh}}
.bk-open .ov{opacity:1;pointer-events:auto}.bk-open .sheet{transform:none}
.sh-head{position:sticky;top:0;z-index:2;background:#fff;padding:14px 20px;border-bottom:1px solid var(--line)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sh-top{display:flex;justify-content:space-between;align-items:center}.sh-top h3{font-family:var(--serif);font-weight:500;font-size:26px}
.x{background:var(--bg2);border:0;border-radius:50%;width:38px;height:38px;color:var(--ink);font-size:16px;cursor:pointer}
.steps{display:flex;gap:6px;margin-top:12px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--main)}
.sh-body{padding:14px 20px 26px}
.grp{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--main2);margin:18px 0 8px;font-weight:800}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;font:600 15px var(--sans);cursor:pointer;color:var(--ink)}
.opt small{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-weight:500}.opt b{color:var(--main2);white-space:nowrap}
.opt .l{display:flex;align-items:center;gap:12px}.opt img{width:50px;height:50px;border-radius:12px;object-fit:cover;flex:0 0 50px}
.opt .em{width:50px;height:50px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 50px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{flex:0 0 60px;height:74px;border:1px solid var(--line);background:#fff;border-radius:16px;cursor:pointer;font-family:inherit;color:var(--ink)}
.day b{display:block;font-size:22px;font-weight:800;line-height:1.2}.day small{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.day.sel{background:var(--main);color:#fff;border-color:var(--main)}.day.sel small{color:rgba(255,255,255,.85)}.day:disabled{opacity:.3;cursor:not-allowed}
.part{font-size:12px;color:var(--muted);margin:14px 0 8px;font-weight:700}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.time{height:46px;border:1px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;font:700 15px var(--sans);color:var(--ink)}
.time.sel{background:var(--deep);color:#fff;border-color:var(--deep)}.time:disabled{opacity:.25;cursor:not-allowed}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:700}
.inp{width:100%;height:52px;border:1px solid var(--line);border-radius:12px;padding:0 16px;font:16px var(--sans);background:#fff;color:var(--ink);outline:none}.inp:focus{border-color:var(--main)}
.sum{background:var(--bg2);border-radius:14px;padding:4px 16px;font-size:14px}.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.sum div:last-child{border:0}.sum span{color:var(--muted)}
.foot{display:flex;gap:10px;margin-top:20px}.foot .btn{flex:1}
.err{color:#c0453a;font-size:13px;margin-top:10px;min-height:18px}
.done{text-align:center;padding:10px 0 4px}
.ring{width:84px;height:84px;border-radius:50%;background:var(--main);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;font-size:36px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.done h4{font-family:var(--serif);font-weight:500;font-size:30px}.done p{color:var(--muted);margin-top:6px}
.ticket{margin:18px 0 6px;border:2px dashed var(--line);border-radius:14px;padding:14px 16px;text-align:left;font-size:14px}.ticket div{display:flex;justify-content:space-between;gap:12px;padding:4px 0}.ticket span{color:var(--muted)}
.mail{margin-top:12px;background:var(--bg2);border-radius:14px;padding:12px 14px;font-size:13px;text-align:left}.mail small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
</style>
</head>

min": {"side": "Serviso pusė", "pitchH": "Registracijos ateina <em>pačios</em>", "pitchP": "Klientai patys registruoja automobilį – kai jiems patogu. Jūs matote dienos planą telefone.", "points": ["Nauja registracija – iškart pranešimas telefone", "Klientas nurodo automobilį – iš anksto žinote, ko reikės", "Priminimas klientui el. paštu dieną prieš (SMS – pasirinktinai)", "Užimtumas vienoje vietoje – jokių dvigubų registracijų", "Telefonu skambinančius klientus įrašote per 10 sekundžių"], "initials": "✓", "unit": "automobiliai", "resources": ["Keltuvas 1", "Keltuvas 2", "Ratų suvedimas"], "open": 8, "close": 18, "sample": [[8, 60, 0, "VW Golf", "Variklio diagnostika", "web"], [8, 120, 1, "Toyota Corolla", "Važiuoklės remontas", "tel"], [9, 60, 2, "Audi A6", "Kompiuterinis ratų suvedimas", "web"], [10, 90, 1, "Opel Zafira", "Stabdžių sistemos remontas", "web"], [11, 45, 0, "Škoda Fabia", "Kondicionieriaus užpildymas", "tel"], [13, 240, 0, "Ford Mondeo", "Variklio remontas", "tel"], [13, 45, 2, "Renault Megane", "Padangų montavimas", "web"], [15, 60, 1, "VW Passat", "Techninė priežiūra", "web"]], "stats": [["Registruota internetu", "18", "šį mėnesį (pavyzdys)"], ["Registruota telefonu", "57", ""], ["Registracijos po darbo valandų", "7", "kai uždaryta"]], "toast": "VW Golf · Variklio diagnostika"}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dur=m=>m>=120?(m%60?(m/60).toFixed(1).replace(".",","):m/60)+" val.":m+" min.";
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const DN=["Sekmadienis","Pirmadienis","Antradienis","Trečiadienis","Ketvirtadienis","Penktadienis","Šeštadienis"],DS=["Sk","Pr","An","Tr","Kt","Pn","Št"];
const MN=["sausio","vasario","kovo","balandžio","gegužės","birželio","liepos","rugpjūčio","rugsėjo","spalio","lapkričio","gruodžio"];
const H=D.hours,P=D.cats;
const pr=p=>p?p:"pagal sutartį";
const num=p=>{const m=String(p).match(/\d+/);return m?+m[0]:null};
const from=g=>{const v=g.items.map(i=>num(i[1])).filter(x=>x!==null);return v.length?Math.min(...v):null};
const pic=(img,ic,cls)=>img?`<img src="img/${img}" alt="">`:`<span class="${cls}">${ic||"•"}</span>`;
// statinis turinys
$("demoL").textContent=D.demoLink||"Kaip tai mato įmonė →";$("lgN").textContent=D.logo;$("lgS").textContent=D.logoSub;
$("hcta").textContent=D.cta;$("hB").textContent=D.cta+" internetu";$("bB").textContent=D.cta+" internetu";
$("hEy").textContent=D.eyebrow;$("hH").innerHTML=D.h1;$("hP").textContent=D.heroText;
$("chips").innerHTML=(D.chips||[]).map(c=>`<span class="chip">${esc(c[0])} <b>${esc(c[1])}</b></span>`).join("");
if(D.heroImg)$("hImg").src="img/"+D.heroImg;else{$("hImg").remove();const h=document.querySelector(".hphoto");h.style.display="flex";h.style.alignItems="center";h.style.justifyContent="center";h.style.background="linear-gradient(135deg,var(--bg2),#fff)";h.insertAdjacentHTML("afterbegin",`<div style="font-size:140px;line-height:1;margin-bottom:60px">${D.heroIcon||"✨"}</div>`)}
$("badge").innerHTML=`<i style="background:var(--main);color:#fff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></i><div><b>${esc(D.badge[1])}</b><small>${esc(D.badge[2])}</small></div>`;
$("sH").innerHTML=D.servH;$("sP").textContent=D.servP;$("pNote").textContent=D.priceNote||"";
if(D.aboutImg)$("aImg").src="img/"+D.aboutImg;else $("aImg").parentNode.remove();
$("aH").innerHTML=D.aboutH;$("aP").textContent=D.aboutP;
$("feat").innerHTML=(D.features||[]).map(f=>`<li><i style="color:var(--main)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></i><span><b>${esc(f[1])}</b> ${esc(f[2])}</span></li>`).join("");
$("stats").innerHTML=(D.stats||[]).map(s=>`<div class="stat"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("");
$("vA").textContent=D.address;$("vS").textContent=D.area+(typeof D.email==="string"&&D.email?" · "+D.email:"");
$("vT").textContent=D.phone;$("vT").href=$("bT").href="tel:"+D.phone.replace(/[^\d+]/g,"");
$("vM").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(D.address+", "+(D.area||"Vilnius"));
$("fL").textContent="© "+D.name+" · "+D.address;$("fR").textContent="Maketas: Kodomeistras.lt"+(D.photoCredit?" · nuotraukos: "+D.photoCredit:"");
if(P.length===4)$("cats").classList.add("c4");$("cats").innerHTML=P.map((g,i)=>`<div class="cat rv" onclick="openBk(${i})">${g.img?`<img src="img/${g.img}" alt="" loading="lazy">`:`<div class="ic">${g.icon||"•"}</div>`}<div class="t"><h3>${esc(g.g)}</h3><p>${esc(g.desc||"")}</p><div class="from"><span>${esc(D.cta)} →</span><span>${from(g)!==null?"nuo "+from(g)+" €":""}</span></div></div></div>`).join("");
let cat=0;
function renderPrices(){
 $("tabs").innerHTML=P.map((g,i)=>`<button class="tab ${i===cat?"on":""}" onclick="cat=${i};renderPrices()">${esc(g.g)}</button>`).join("");
 $("plist").innerHTML=P[cat].items.map((it,ii)=>`<div class="pi"><span>${esc(it[0])}<small>apie ${dur(it[2])}</small></span><span class="r"><b>${esc(pr(it[1]))}</b><button onclick="openBk(${cat},${ii})">${esc(D.cta)}</button></span></div>`).join("");
}
renderPrices();
(function(){const now=new Date(),d=now.getDay(),h=now.getHours()+now.getMinutes()/60,t=H[d],st=$("status");
 const f=x=>Math.floor(x)+":"+(x%1?"30":"00");
 if(t&&h>=t[0]&&h<t[1]){st.textContent="Atidaryta iki "+f(t[1]);st.classList.add("open")}else if(t&&h<t[0])st.textContent="Atidaroma "+f(t[0]);else st.textContent="Šiandien uždaryta";
 $("hours").innerHTML=[1,2,3,4,5,6,0].map(i=>`<div class="${i===d?"today":""}"><span>${DN[i]}</span><span>${H[i]?f(H[i][0])+" – "+f(H[i][1]):(D.closedText||"nedirbame")}</span></div>`).join("")})();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));
// registracija
let S={};
function openBk(g=null,i=null){S={step:g===null?0:(i===null?1:2),g,i};document.getElementById("bk").classList.add("bk-open");document.body.style.overflow="hidden";draw()}
function closeBk(){document.getElementById("bk").classList.remove("bk-open");document.body.style.overflow=""}
function go(n){S.step=n;draw();document.querySelector(".sheet").scrollTop=0}
function busy(day,slot){let x=2166136261;for(const c of day+"|"+slot+"|"+S.g)x=Math.imul(x^c.charCodeAt(0),16777619)>>>0;x^=x>>>13;x=Math.imul(x,1274126177)>>>0;x^=x>>>16;return x%100<33}
function draw(){
 const b=$("bkB");[...document.querySelectorAll("#steps i")].forEach((el,i)=>el.classList.toggle("on",i<=S.step));
 $("bkT").textContent=["Ko reikia?","Paslauga","Laikas","Kontaktai","Iki susitikimo!"][S.step];
 if(S.step===0)b.innerHTML=P.map((g,gi)=>`<button class="opt" onclick="S.g=${gi};go(1)"><span class="l">${pic(g.img,g.icon,"em")}<span>${esc(g.g)}<small>${g.items.length} paslaugos${from(g)!==null?" · nuo "+from(g)+" €":""}</small></span></span>→</button>`).join("");
 if(S.step===1){const g=P[S.g];b.innerHTML=`<div class="grp">${esc(g.g)}</div>`+g.items.map((it,ii)=>`<button class="opt" onclick="S.i=${ii};go(2)"><span>${esc(it[0])}<small>apie ${dur(it[2])}</small></span><b>${esc(pr(it[1]))}</b></button>`).join("")+`<div class="foot"><button class="btn btn-line" onclick="go(0)">Atgal</button></div>`}
 if(S.step===2){const it=P[S.g].items[S.i],len=Math.min(it[2],120);const base=new Date();base.setHours(0,0,0,0);const days=[];
  for(let k=0;k<21;k++){const d=new Date(base);d.setDate(base.getDate()+k);days.push(d)}
  const soon=new Date(Date.now()+60*60000);
  const slotsFor=ds=>{const d=new Date(ds+"T00:00:00"),h=H[d.getDay()];const r=[];if(!h)return r;for(let t=h[0];t+len/60<=h[1];t+=.5){const lbl=Math.floor(t)+":"+(t%1?"30":"00");const dt=new Date(d);dt.setHours(Math.floor(t),t%1?30:0);r.push({lbl,t,dis:dt<soon||busy(ds,lbl)})}return r};
  if(!S.day){const f=days.find(d=>slotsFor(iso(d)).some(s=>!s.dis));S.day=iso(f)}
  const sl=slotsFor(S.day);const part=(n,a,z)=>{const xs=sl.filter(s=>s.t>=a&&s.t<z);return xs.length?`<div class="part">${n}</div><div class="times">${xs.map(s=>`<button class="time ${S.time===s.lbl?"sel":""}" ${s.dis?"disabled":""} onclick="S.time='${s.lbl}';draw()">${s.lbl}</button>`).join("")}</div>`:""};
  b.innerHTML=`<div class="sum"><div><span>Paslauga</span><b>${esc(it[0])}</b></div></div><div style="height:12px"></div><div class="days">${days.map(d=>{const ds=iso(d);const ok=slotsFor(ds).some(s=>!s.dis);return`<button class="day ${ds===S.day?"sel":""}" ${ok?"":"disabled"} onclick="S.day='${ds}';S.time=null;draw()"><small>${DS[d.getDay()]}</small><b>${d.getDate()}</b></button>`}).join("")}</div>`+part("Rytas",0,12)+part("Diena",12,16)+part("Vakaras",16,24)+`<div class="foot"><button class="btn btn-line" onclick="go(1)">Atgal</button><button class="btn btn-main" ${S.time?"":"disabled"} onclick="go(3)">Toliau</button></div>`;
  setTimeout(()=>{const s=document.querySelector(".day.sel");s&&s.scrollIntoView({inline:"center",block:"nearest"})},0)}
 if(S.step===3){const it=P[S.g].items[S.i],d=new Date(S.day+"T00:00:00");const ex=D.extraField;
  b.innerHTML=`<div class="sum"><div><span>Paslauga</span><b>${esc(it[0])}</b></div><div><span>Laikas</span><b>${DN[d.getDay()]}, ${MN[d.getMonth()]} ${d.getDate()} d., ${S.time}</b></div><div><span>Kaina</span><b style="color:var(--main2)">${esc(pr(it[1]))}</b></div></div>`+
  `<label for="nm">Vardas</label><input class="inp" id="nm" autocomplete="given-name" value="${esc(S.nm||"")}">`+
  (ex?`<label for="ex">${esc(ex[0])}</label><input class="inp" id="ex" placeholder="${esc(ex[1])}" value="${esc(S.ex||"")}">`:"")+
  `<label for="ph">Telefonas</label><input class="inp" id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="+370 6__ _____" value="${esc(S.ph||"")}">`+
  `<label for="em">El. paštas (priminimui)</label><input class="inp" id="em" type="email" autocomplete="email" value="${esc(S.em||"")}">`+
  `<div class="err" id="err"></div><div class="foot"><button class="btn btn-line" onclick="go(2)">Atgal</button><button class="btn btn-main" onclick="confirmBk()">Patvirtinti</button></div>`}
 if(S.step===4){const it=P[S.g].items[S.i],d=new Date(S.day+"T00:00:00");
  b.innerHTML=`<div class="done"><div class="ring">✓</div><h4>Ačiū, ${esc(S.nm)}!</h4><p>Jūsų laikas užrezervuotas.</p><div class="ticket"><div><span>Paslauga</span><b>${esc(it[0])}</b></div>${S.ex?`<div><span>${esc(D.extraField[0])}</span><b>${esc(S.ex)}</b></div>`:""}<div><span>Kada</span><b>${MN[d.getMonth()]} ${d.getDate()} d., ${S.time}</b></div><div><span>Kur</span><b>${esc(D.address)}</b></div></div>
  <div class="mail"><small>✉ Patvirtinimas el. paštu</small>Jūsų vizitas patvirtintas. Dieną prieš atsiųsime priminimą, o atšaukti galėsite paspaudę nuorodą laiške.</div><p class="note">Tai demonstracija – tikroje sistemoje ${esc(D.name)} iškart gautų pranešimą.</p></div><div class="foot"><button class="btn btn-main" onclick="closeBk()">Puiku</button></div>`}
}
function confirmBk(){S.nm=$("nm").value.trim();S.ph=$("ph").value.trim();S.em=$("em").value.trim();S.ex=$("ex")?$("ex").value.trim():"";
 if(!S.nm){$("err").textContent="Įveskite vardą.";return}if(S.ph.replace(/\D/g,"").length<8){$("err").textContent="Įveskite telefono numerį.";return}go(4)}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeBk()});
if(location.hash==="#book"){openBk(0,0);let d=new Date();do{d.setDate(d.getDate()+1)}while(!H[d.getDay()]);S.day=iso(d);draw();const t=[...document.querySelectorAll(".time:not(:disabled)")][3];if(t){S.time=t.textContent;draw()}}
</script>
